name: Manual CI

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: "'auto' compiles configs/patches/*.toml first, then builds every enabled app"
        required: true
        type: choice
        default: "auto"
        options:
          - "auto"
          - "configs/config.manual.toml"
          - "configs/beta_build.json"
          - "configs/stable_build.json"
      remove_apks:
        description: "Optional: APKs to remove from cache (space-separated, e.g., com.brave.browser-1.93.138-*.apk)"
        required: false
        type: string
        default: ""

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  build_manual:
    uses: ./.github/workflows/build.yml
    with:
      config_file: ${{ inputs.config_file }}
      compile: ${{ inputs.config_file == 'auto' }}
      remove_apks: ${{ inputs.remove_apks }}
    secrets: inherit

  trigger_cleanup:
    needs: [build_manual]
    if: ${{ always() && needs.build_manual.result == 'success' }}
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit

  trigger_notify_failure:
    needs: [build_manual]
    if: ${{ failure() }}
    uses: ./.github/workflows/notify.yml
    with:
      workflow_name: "Manual CI"
      already_reported: ${{ needs.build_manual.outputs.reported_failures == 'true' }}
    secrets: inherit
