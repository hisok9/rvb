# Manual CI fixture — the 8 keeper apps, as a frozen snapshot.
#
# PREFER `auto` (Manual CI's default): build.yml now runs
# compile_patch_configs.py first and builds the live enabled set straight from
# configs/patches/*.toml, so it can never drift. Pick THIS file instead when you
# want a fixed, hand-controlled set of apps.
#
# Dispatch: Actions -> Manual CI -> Run workflow.
# (The cron in ci.yml only fires when a patch source or an app APK upstream
# changes — editing a TOML is not a trigger.)
#
# Why this file exists separately from configs/patches/*.toml: manual-ci.yml
# hands its config_file straight to build.yml, which never recompiles TOMLs
# (build_resolve_context.sh only reads patches-version). build.yml does
# materialise configs/ from the `data` branch, so edits here ship on push.
#
# No file-level preamble on purpose: build_resolve_context.sh runs
# `awk '/^\[/ {exit}'` and treats an empty preamble as stable / non-prerelease.
# Every file-level default from the source TOML is therefore inlined per table,
# and `patches-version` falls back to the stable channel.
#
# HAND-MAINTAINED: when you change an app in configs/patches/*.toml, mirror it here.

[YouTube-Morphe]
enabled = true
pkg-name = "com.google.android.youtube"
app-name = "YouTube"
brand = "Morphe"
build-mode = "both"
patch-folder = "youtube"
patches-source = "MorpheApp/morphe-patches"
excluded-patches = "'Custom branding'"
apkmirror-dlurl = "https://apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
apkpure-dlurl = "https://apkpure.com/youtube-app/com.google.android.youtube"
apkcombo-dlurl = "https://apkcombo.com/youtube/com.google.android.youtube"
archive-dlurl = "https://archive.org/download/geologically/apks/com.google.android.youtube"

[YouTubeMusic-Morphe]
